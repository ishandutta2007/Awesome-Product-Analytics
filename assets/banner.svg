<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#080B14"/><stop offset="50%" stop-color="#0F172A"/><stop offset="100%" stop-color="#090D16"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60A5FA"/><stop offset="50%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#34D399"/></linearGradient><linearGradient id="line-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38BDF8" stop-opacity=".2"/><stop offset="50%" stop-color="#818CF8" stop-opacity=".8"/><stop offset="100%" stop-color="#34D399" stop-opacity=".2"/></linearGradient><linearGradient id="area-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366F1" stop-opacity=".25"/><stop offset="100%" stop-color="#6366F1" stop-opacity="0"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1E293B" stop-opacity=".8"/><stop offset="100%" stop-color="#0F172A" stop-opacity=".85"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1E293B" stroke-opacity=".6" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#475569" fill-opacity=".5"/></pattern><style>@keyframes pulseSlow{0%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.05)}}@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatAlt{0%{transform:translateY(0)}50%{transform:translateY(8px)}}@keyframes waveMotion{0%{transform:translateX(0)}50%{transform:translateX(-40px)}}@keyframes glowPulse{0%{opacity:.4}50%{opacity:.9}}.pulse-ambient{animation:pulseSlow 8s ease-in-out infinite;transform-origin:center}.floating-pill1{animation:floatSlow 6s ease-in-out infinite}.floating-pill2{animation:floatAlt 7s ease-in-out infinite 1s}.floating-pill3{animation:floatSlow 5s ease-in-out infinite 2s}.floating-pill4{animation:floatAlt 8s ease-in-out infinite 1.5s}.flow-wave{animation:waveMotion 12s ease-in-out infinite}.stream-line{stroke-dasharray:8 6;animation:dashAnim 35s linear infinite}.node-pulse{animation:glowPulse 3s ease-in-out infinite alternate}.badge-text,.sub-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.sub-text{font-weight:400}.badge-text{font-size:11px;font-weight:600;letter-spacing:.5px}</style></defs><rect width="1200" height="360" fill="url(#bg-grad)"/><rect width="1200" height="360" fill="url(#grid)"/><circle cx="200" cy="70" r="140" fill="#4F46E5" fill-opacity=".15" class="pulse-ambient" filter="url(#glow)"/><circle cx="1000" cy="280" r="160" fill="#06B6D4" fill-opacity=".12" class="pulse-ambient" filter="url(#glow)"/><circle cx="600" cy="180" r="220" fill="#9333EA" fill-opacity=".08" class="pulse-ambient" filter="url(#glow)"/><g class="flow-wave" opacity=".65"><path fill="url(#area-grad)" d="M-50,280 Q 150,230 350,270 T 750,210 T 1150,240 T 1300,200 L 1300,360 L -50,360 Z"/><path fill="none" stroke="url(#line-grad)" stroke-width="3" d="M-50,280 Q 150,230 350,270 T 750,210 T 1150,240 T 1300,200" filter="url(#soft-glow)"/><path fill="none" stroke="#06B6D4" stroke-opacity=".4" stroke-width="1.5" d="M-50,295 Q 180,260 380,290 T 780,240 T 1180,265 T 1300,230" class="stream-line"/></g><g opacity=".25" transform="translate(880, 80)"><rect width="14" height="90" x="0" y="80" fill