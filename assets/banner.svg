<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="area-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.5"/>
    </pattern>

    <style>
      @keyframes pulseSlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.05); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatAlt {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes waveMotion {
        0% { transform: translateX(0); }
        50% { transform: translateX(-40px); }
        100% { transform: translateX(0); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }

      .pulse-ambient { animation: pulseSlow 8s ease-in-out infinite; transform-origin: center; }
      .floating-pill1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-pill2 { animation: floatAlt 7s ease-in-out infinite 1s; }
      .floating-pill3 { animation: floatSlow 5s ease-in-out infinite 2s; }
      .floating-pill4 { animation: floatAlt 8s ease-in-out infinite 1.5s; }
      .flow-wave { animation: waveMotion 12s ease-in-out infinite; }
      .stream-line { stroke-dasharray: 8 6; animation: dashAnim 35s linear infinite; }
      .node-pulse { animation: glowPulse 3s ease-in-out infinite alternate; }

      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>

  <!-- Matrix Grid -->
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="200" cy="70" r="140" fill="#4F46E5" fill-opacity="0.15" class="pulse-ambient" filter="url(#glow)"/>
  <circle cx="1000" cy="280" r="160" fill="#06B6D4" fill-opacity="0.12" class="pulse-ambient" filter="url(#glow)"/>
  <circle cx="600" cy="180" r="220" fill="#9333EA" fill-opacity="0.08" class="pulse-ambient" filter="url(#glow)"/>

  <!-- Dynamic Analytics Wave Graph in Background (Below Text) -->
  <g class="flow-wave" opacity="0.65">
    <!-- Area under curve -->
    <path d="M-50,280 Q 150,230 350,270 T 750,210 T 1150,240 T 1300,200 L 1300,360 L -50,360 Z" fill="url(#area-grad)"/>
    <!-- Line on top -->
    <path d="M-50,280 Q 150,230 350,270 T 750,210 T 1150,240 T 1300,200" fill="none" stroke="url(#line-grad)" stroke-width="3" filter="url(#soft-glow)"/>
    <path d="M-50,295 Q 180,260 380,290 T 780,240 T 1180,265 T 1300,230" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4" class="stream-line"/>
  </g>

  <!-- Background Animated Chart Bars (Right Side) -->
  <g opacity="0.25" transform="translate(880, 80)">
    <rect x="0" y="80" width="14" height="90" rx="4" fill="#6366F1">
      <animate attributeName="height" values="90;130;70;90" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="80;40;100;80" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="50" width="14" height="120" rx="4" fill="#38BDF8">
      <animate attributeName="height" values="120;60;140;120" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="50;110;30;50" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="100" width="14" height="70" rx="4" fill="#A855F7">
      <animate attributeName="height" values="70;110;50;70" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="100;60;120;100" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="30" width="14" height="140" rx="4" fill="#34D399">
      <animate attributeName="height" values="140;90;150;140" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="30;80;20;30" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="96" y="70" width="14" height="100" rx="4" fill="#F43F5E">
      <animate attributeName="height" values="100;140;80;100" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="70;30;90;70" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Background Floating Feature Badges (Positioned Safely to Not Obscure Title) -->
  <!-- Top Left Pill -->
  <g class="floating-pill1" transform="translate(60, 48)">
    <rect width="160" height="32" rx="16" fill="#1E293B" fill-opacity="0.75" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="16" r="4" fill="#38BDF8" class="node-pulse"/>
    <text x="28" y="20" fill="#94A3B8" class="badge-text">⚡ REAL-TIME EVENTS</text>
  </g>

  <!-- Top Right Pill -->
  <g class="floating-pill2" transform="translate(980, 48)">
    <rect width="160" height="32" rx="16" fill="#1E293B" fill-opacity="0.75" stroke="#A855F7" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="16" r="4" fill="#A855F7" class="node-pulse"/>
    <text x="28" y="20" fill="#C084FC" class="badge-text">🎥 SESSION REPLAY</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="floating-pill3" transform="translate(70, 290)">
    <rect width="165" height="32" rx="16" fill="#1E293B" fill-opacity="0.75" stroke="#34D399" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="16" r="4" fill="#34D399" class="node-pulse"/>
    <text x="28" y="20" fill="#6EE7B7" class="badge-text">🛡️ PRIVACY &amp; GDPR</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="floating-pill4" transform="translate(965, 290)">
    <rect width="175" height="32" rx="16" fill="#1E293B" fill-opacity="0.75" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="16" r="4" fill="#F59E0B" class="node-pulse"/>
    <text x="28" y="20" fill="#FCD34D" class="badge-text">📈 FUNNELS &amp; RETENTION</text>
  </g>

  <!-- FOREGROUND: Central Hero Content Plate (Guarantees Title & Subtitle Clarity) -->
  <g transform="translate(180, 92)">
    <!-- Protective Backing Card with Soft Border -->
    <rect width="840" height="165" rx="18" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6" filter="url(#soft-glow)"/>

    <!-- Category Eyebrow Pill -->
    <g transform="translate(320, 16)">
      <rect width="200" height="24" rx="12" fill="#312E81" fill-opacity="0.6" stroke="#6366F1" stroke-width="1" stroke-opacity="0.5"/>
      <text x="100" y="16" fill="#A5B4FC" font-size="10.5" font-weight="700" letter-spacing="1.2" text-anchor="middle" font-family="system-ui, sans-serif">
        CURATED ECOSYSTEM 2026
      </text>
    </g>

    <!-- Main Title -->
    <text x="420" y="82" text-anchor="middle" class="title-text" font-size="40" fill="#FFFFFF" filter="url(#soft-glow)">
      Awesome Product Analytics
    </text>

    <!-- Subtitle -->
    <text x="420" y="118" text-anchor="middle" class="sub-text" font-size="15.5" fill="#94A3B8">
      Top SaaS Platforms &amp; Open-Source Projects for Behavioral Intelligence &amp; Event Tracking
    </text>

    <!-- Feature Highlights Dots -->
    <g transform="translate(230, 142)">
      <circle cx="0" cy="0" r="3" fill="#38BDF8"/>
      <text x="10" y="3.5" fill="#CBD5E1" font-size="12" font-family="system-ui, sans-serif">Event Tracking</text>

      <circle cx="120" cy="0" r="3" fill="#A855F7"/>
      <text x="130" y="3.5" fill="#CBD5E1" font-size="12" font-family="system-ui, sans-serif">Session Replay</text>

      <circle cx="250" cy="0" r="3" fill="#34D399"/>
      <text x="260" y="3.5" fill="#CBD5E1" font-size="12" font-family="system-ui, sans-serif">Funnel Analysis</text>

      <circle cx="380" cy="0" r="3" fill="#F43F5E"/>
      <text x="390" y="3.5" fill="#CBD5E1" font-size="12" font-family="system-ui, sans-serif">Self-Hosted</text>
    </g>
  </g>
</svg>
